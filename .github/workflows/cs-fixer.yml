name: "Coding Standards"

# Reusable: runs phpcbf (twice, as complex fixes need a second pass) and
# opens a PR with the result. The caller grants contents: write and
# pull-requests: write.

on:
  workflow_call:
    inputs:
      php-version:
        description: "PHP version. Keep it equal to php-plugin.yml's quality-php-version so phpcbf cannot produce fixes the quality gate rejects."
        type: string
        default: "8.4"
      working-directory:
        description: "Directory holding composer.json."
        type: string
        default: "."
      add-paths:
        description: "Paths to include in the PR (peter-evans/create-pull-request add-paths)."
        type: string
        default: "*.php"
      branch:
        description: "Branch the fixes are pushed to."
        type: string
        default: "cs-fixer"

permissions:
  contents: read

jobs:
  fix:
    name: "Fix coding standards"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Install PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none

      - name: "Cache Composer dependencies"
        uses: actions/cache@v4
        with:
          path: ${{ inputs.working-directory }}/vendor
          key: composer-${{ runner.os }}-php${{ inputs.php-version }}-${{ hashFiles(format('{0}/composer.lock', inputs.working-directory), format('{0}/composer.json', inputs.working-directory)) }}
          restore-keys: composer-${{ runner.os }}-php${{ inputs.php-version }}-

      - name: "Install Composer dependencies"
        run: composer install --no-progress --no-interaction

      - name: "Fix violations"
        run: |
          # phpcbf auto-discovers .phpcs.xml.dist, the same ruleset the
          # quality gate enforces.
          #
          # phpcbf exit codes: 0 clean, 1 violations fixed, 2 some left
          # unfixable, 3 error. Swallowing 2 and 3 too would let a tooling
          # failure look identical to "already clean".
          for attempt in 1 2; do
            vendor/bin/phpcbf && continue
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "::error::phpcbf exited ${status} on pass ${attempt}"
              exit "$status"
            fi
          done

      - name: "Check for changes"
        id: diff
        run: |
          if ! git diff --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Create pull request"
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: ${{ inputs.add-paths }}
          branch: ${{ inputs.branch }}
          commit-message: "Fix coding standards"
          title: "Fix coding standards violations"
          body: |
            Automated changes from running `phpcbf`.
          delete-branch: true
