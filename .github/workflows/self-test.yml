name: "Self-test"

# CI for this repository:
#   - actionlint and the Jest suite, always;
#   - dogfood: js.yml on this repo's own Node code (actions/, tools/), with
#     the thresholds in ./quality-thresholds.json. Its sections are this
#     repo's PR report;
#   - fixtures: php-plugin.yml and js.yml against test/fixtures/, but only
#     when a PR touches the reusable workflows, actions/ or the fixtures
#     (always on push). Their sections are prefixed "fixture-", so they only
#     appear in the PR report when they are relevant to the PR.
# Everything loads the report scripts from this very commit. On a PR,
# self-test-report.yml then posts the merged report.

on:
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  changes:
    name: "Detect fixture-relevant changes"
    runs-on: ubuntu-latest
    outputs:
      fixtures: ${{ steps.gate.outputs.run || 'true' }}
    steps:
      - name: "Checkout"
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: "Match changed files"
        id: gate
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          node actions/render-report/index.js changes --files "$RUNNER_TEMP/changed.txt" --paths '
            .github/workflows/php-plugin.yml
            .github/workflows/js.yml
            .github/workflows/pr-report.yml
            .github/workflows/self-test.yml
            actions/**
            tools/**
            test/fixtures/**
          '

  actionlint:
    name: "actionlint"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Install actionlint"
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          rm actionlint.tar.gz

      - name: "Lint workflows and templates"
        run: ./actionlint -color .github/workflows/*.yml workflow-templates/*.yml

  jest:
    name: "Jest"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: "Install npm dependencies"
        run: npm ci

      - name: "Run the test suite"
        run: npm test

      - name: "Check the complexity toolchain installs from its lock file"
        run: npm ci --prefix tools/js-complexity --no-audit --no-fund

  dogfood:
    name: "js.yml (this repo)"
    uses: ./.github/workflows/js.yml
    with:
      js-source-paths: "actions tools/js-complexity"
      complexity-script: ""
      ci-ref: ${{ github.sha }}

  php-fixture:
    name: "php-plugin.yml (fixture)"
    needs: changes
    if: needs.changes.outputs.fixtures == 'true'
    uses: ./.github/workflows/php-plugin.yml
    with:
      working-directory: test/fixtures/php-plugin
      # 7.4 proves the lint leg for repos supporting older PHP than their
      # dev tools: the lock targets 8.2 (PHPUnit 11), so the lint legs use a
      # standalone parallel-lint instead of the project's vendor/.
      php-versions: '["7.4", "8.2", "8.4"]'
      lint-standalone: true
      # Gated by the changes job above, so the inner path gate is opened.
      paths: "**"
      report-id-prefix: "fixture-"
      report-title-prefix: "Fixture: "
      ci-ref: ${{ github.sha }}

  js-fixture:
    name: "js.yml (fixture)"
    needs: changes
    if: needs.changes.outputs.fixtures == 'true'
    uses: ./.github/workflows/js.yml
    with:
      working-directory: test/fixtures/js-package
      js-source-paths: "src/"
      paths: "**"
      report-id-prefix: "fixture-"
      report-title-prefix: "Fixture: "
      ci-ref: ${{ github.sha }}

  # Merges the sections the fixture runs uploaded, the way pr-report.yml
  # does, shows the result in the step summary, and requires every fixture
  # section to have arrived and passed.
  render-smoke:
    name: "Render smoke test"
    needs: [dogfood, php-fixture, js-fixture]
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Download report sections"
        uses: actions/download-artifact@v8
        with:
          pattern: report-*
          path: ${{ runner.temp }}/report

      - name: "Read report-meta"
        if: github.event_name == 'pull_request'
        run: node actions/render-report/index.js read-meta --dir "$RUNNER_TEMP/report"

      - name: "Merge the sections"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node actions/render-report/index.js merge --dir "$RUNNER_TEMP/report" \
            --head-sha "$HEAD_SHA" --base-sha "$BASE_SHA" --run-url "$RUN_URL" \
            --run-name "Self-test" --conclusion success --output "$RUNNER_TEMP/pr-report.md"
          cat "$RUNNER_TEMP/pr-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: "Require every fixture section to pass"
        run: |
          for id in php-quality php-coverage php-metrics js-coverage js-complexity; do
            file="$RUNNER_TEMP/report/report-section-fixture-$id/$id.json"
            jq -e '.status == "pass"' "$file" > /dev/null || {
              echo "::error::Section $id is missing or did not pass."
              exit 1
            }
          done
          # The JS fixture must be measured through its own lint:complexity
          # config; a silent fallback to the built-in one is a failure here.
          jq -e '.summary | test("repo.s own ESLint config")' \
            "$RUNNER_TEMP/report/report-section-fixture-js-complexity/js-complexity.json" > /dev/null || {
            echo "::error::js-complexity fell back to the built-in config instead of the fixture's lint:complexity."
            exit 1
          }
          if grep -q 'rejected as malformed' "$RUNNER_TEMP/pr-report.md"; then
            echo "::error::The merge rejected a fixture section."
            exit 1
          fi
