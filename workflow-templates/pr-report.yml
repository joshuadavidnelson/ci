name: "PR Report"

# Posts the sticky PR report from the Integrate run's artifacts. Runs from
# the default branch only (workflow_run), so the comment starts appearing
# once this file is merged there.

on:
  workflow_run:
    workflows: [Integrate]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  report:
    uses: joshuadavidnelson/ci/.github/workflows/pr-report.yml@v1
